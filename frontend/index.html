<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MQTT Manager</title>
    <script>
      // Apply the saved (or system) theme before first paint, so the app never
      // flashes the wrong colors. Kept in sync with src/lib/theme.ts.
      (function () {
        try {
          var v = localStorage.getItem("mqtt-manager:theme");
          var mode =
            v === "light" || v === "dark"
              ? v
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
</head>
<body>
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
